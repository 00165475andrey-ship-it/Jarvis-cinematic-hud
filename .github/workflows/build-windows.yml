name: Build Windows app
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build/Release/JarvisDesktop.exe package/
          @'
          J.A.R.V.I.S. Desktop
          Запустите JarvisDesktop.exe. Настройки сохраняются в jarvis.ini рядом с программой.
          Windows 7 SP1 x64 / Windows 10/11 x64. Windows 7 compatibility depends on required system updates and must be validated on a Windows 7 machine.
          '@ | Set-Content package/README.txt -Encoding UTF8
          ./tools/prepare-vosk.ps1 -Destination package
          Compress-Archive -Path package/* -DestinationPath JARVIS-Desktop-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desktop-Windows-x64
          path: JARVIS-Desktop-Windows-x64.zip
          if-no-files-found: error
