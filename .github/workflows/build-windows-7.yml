name: Build Windows 7 compatible app
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-windows-7:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install MSVC v142 toolset (Windows 7 compatible)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products '*' -property installationPath
          if (-not $vsPath) { throw "Visual Studio installation not found" }
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          & $installer modify --installPath "$vsPath" --add Microsoft.VisualStudio.Component.VC.v142.x86.x64 --quiet --wait --norestart
          if ($LASTEXITCODE -ne 0) { throw "Could not install MSVC v142 toolset" }
      - name: Configure for Windows 7 SP1 x64
        run: cmake -S . -B build-win7 -A x64 -T v142 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded -DCMAKE_CXX_FLAGS="/DWINVER=0x0601 /D_WIN32_WINNT=0x0601"
      - name: Build
        run: cmake --build build-win7 --config Release
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package-win7 | Out-Null
          Copy-Item build-win7/Release/JarvisDesktop.exe package-win7/
          @'
          J.A.R.V.I.S. Desktop — Windows 7 edition
          Требуется Windows 7 SP1 x64.
          Запустите JarvisDesktop.exe. Настройки сохраняются в jarvis.ini рядом с программой.
          Сборка использует MSVC v142 и статическую C++ runtime-библиотеку.
          Vosk runtime и русская модель включены в архив. Совместимость Vosk DLL на Windows 7 требует проверки на реальном ПК.
          '@ | Set-Content package-win7/README.txt -Encoding UTF8
          ./tools/prepare-vosk.ps1 -Destination package-win7
          if (-not (Test-Path package-win7/libvosk.dll)) { throw "Vosk runtime missing from Windows 7 package" }
          if (-not (Test-Path package-win7/models/vosk-model-small-ru-0.22/am/final.mdl)) { throw "Russian Vosk model missing from Windows 7 package" }
          Compress-Archive -Path package-win7/* -DestinationPath JARVIS-Desktop-Windows-7-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Desktop-Windows-7-x64
          path: JARVIS-Desktop-Windows-7-x64.zip
          if-no-files-found: error
